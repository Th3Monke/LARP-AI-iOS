name: LARPAI
options:
  bundleIdPrefix: ai.larp
  deploymentTarget:
    iOS: "16.4"
settings:
  base:
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
packages:
  StableDiffusion:
    url: https://github.com/apple/ml-stable-diffusion
    exactVersion: 1.1.1
targets:
  LARPAI:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
      - package: StableDiffusion
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: LARP.AI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        NSMicrophoneUsageDescription: LARP.AI uses the microphone so you can talk instead of type. Your voice is turned into text on this iPhone.
        NSSpeechRecognitionUsageDescription: LARP.AI turns your voice into text on this iPhone.
        NSPhotoLibraryAddUsageDescription: LARP.AI saves the pictures it makes to your Photos when you ask it to.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.larp.ios
        PRODUCT_NAME: LARPAI
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    postBuildScripts:
      - name: Make the build sideload-friendly
        basedOnDependencyAnalysis: false
        script: |
          set -e
          APP="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          ICON="${SRCROOT}/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          # Signing tools show these loose icons, but Xcode stores them in Apple's CgBI PNG format
          # that other tools can't read. Replace them with normal PNGs (the home screen uses Assets.car).
          if [ -f "$APP/AppIcon60x60@2x.png" ]; then sips -s format png -z 120 120 "$ICON" --out "$APP/AppIcon60x60@2x.png" >/dev/null; fi
          if [ -f "$APP/AppIcon76x76@2x~ipad.png" ]; then sips -s format png -z 152 152 "$ICON" --out "$APP/AppIcon76x76@2x~ipad.png" >/dev/null; fi
          # Ad-hoc signature (inside out), so re-signing tools have a signature to replace.
          for f in "$APP"/Frameworks/*.framework; do codesign --force --sign - --timestamp=none "$f"; done
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP" && echo "ad-hoc signature OK"
